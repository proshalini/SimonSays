<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Simon Says</h1>
    <h2>Press Any Key to Start again!!</h2>
    <div class="colorpallete">
        <div class="box red" type="button" id="red"></div>
        <div class="box green"type="button" id="green"></div>
        <div class="box pink" type="button" id="pink"></div>
        <div class="box purple" type="button" id="purple"></div>
    </div>
    <div class="highSc">
        <h3>Highest Score</h3>
        <p id="maxSc">0</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
